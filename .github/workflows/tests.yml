name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the image ships; 3.13 is here to catch deprecations
        # before they become someone else's upgrade problem.
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt pytest

      - name: Test
        # The suite touches no network, no Telegram and no sidecar, so a
        # failure here is a real failure and not the weather.
        run: python -m pytest tests -q
